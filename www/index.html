<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Veo 3 Studio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .progress-bar-bg {
            width: 100%; height: 8px; background: #0f172a;
            border-radius: 99px; overflow: hidden; margin: 12px 0;
            border: 1px solid #334155;
        }
        .progress-bar-fill {
            height: 100%; width: 0%; background: linear-gradient(90deg, #3b82f6, #06b6d4);
            transition: width 0.4s ease;
        }
        .log-box {
            background: #090d16; border: 1px solid #1e293b; border-radius: 10px;
            padding: 10px; max-height: 180px; overflow-y: auto; text-align: left;
            font-family: monospace; font-size: 0.78rem; line-height: 1.45;
            color: #38bdf8; margin-top: 10px;
        }
        .log-entry { margin-bottom: 4px; border-bottom: 1px dashed #1e293b; padding-bottom: 3px; }
        .log-time { color: #64748b; margin-right: 6px; }
        .log-err { color: #f87171; }
        .log-ok { color: #4ade80; }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>AI Veo 3 Studio</h1>
            <button id="btnSettings" class="icon-btn">⚙️</button>
        </header>

        <main id="mainContent">
            <div class="card">
                <label for="topicInput">Ide Cerita / Prompt Video</label>
                <textarea id="topicInput" rows="3" placeholder="Contoh: Cerita lucu tukang cukur salah potong rambut pelanggan..."></textarea>
                
                <div class="row" style="margin-bottom: 10px;">
                    <select id="styleSelect">
                        <option value="2d stickman cartoon animation, clean white background, bold black outlines, expressive facial expressions">Gaya: Animasi Stickman 2D</option>
                        <option value="3d pixar style animation, vibrant lighting, expressive characters">Gaya: Animasi 3D</option>
                        <option value="cinematic realistic video, 4k, natural lighting">Gaya: Sinematik Realistis</option>
                        <option value="modern anime style animation, clean lineart">Gaya: Anime</option>
                    </select>
                </div>

                <div class="row">
                    <select id="sceneCountSelect">
                        <option value="1">Durasi: 1 Adegan (~8 dtk)</option>
                        <option value="2">Durasi: 2 Adegan (~16 dtk)</option>
                        <option value="3" selected>Durasi: 3 Adegan (~24 dtk)</option>
                        <option value="4">Durasi: 4 Adegan (~32 dtk)</option>
                    </select>
                    <button id="btnGenerate" class="primary-btn">Render Veo 3 🎬</button>
                </div>
            </div>

            <!-- Panel Progress & Live Log -->
            <div id="loading" class="card hidden" style="text-align: center;">
                <div class="spinner"></div>
                <p id="loadingText" style="font-weight: 600; color: #f8fafc;">Menyiapkan proyek...</p>
                <div class="progress-bar-bg">
                    <div id="progressBar" class="progress-bar-fill"></div>
                </div>
                <div id="logContainer" class="log-box"></div>
            </div>

            <div id="resultArea" class="hidden">
                <div class="card">
                    <h3>Hasil Video Utuh (9:16)</h3>
                    <video id="videoPreview" controls playsinline loop style="width:100%; border-radius:12px; margin-top:8px; background:#000;"></video>
                    <button id="btnDownloadVideo" class="primary-btn" style="width:100%; margin-top:10px;">Simpan Video ke Galeri ⬇️</button>
                </div>

                <div class="card">
                    <h3>Naskah & Caption</h3>
                    <div id="scriptOutput" class="script-box"></div>
                    <button id="btnCopyScript" class="secondary-btn">Salin Naskah</button>
                </div>
            </div>
        </main>

        <!-- Elemen tersembunyi untuk menggabungkan klip multi-adegan -->
        <canvas id="mergeCanvas" width="720" height="1280" class="hidden"></canvas>
        <video id="hiddenPlayer" playsinline muted class="hidden"></video>

        <!-- Modal Pengaturan API Key -->
        <div id="settingsModal" class="modal hidden">
            <div class="modal-content">
                <h3>Pengaturan API Veo 3</h3>
                <p>Masukkan Gemini API Key dengan Billing aktif (Google Cloud):</p>
                <input type="password" id="apiKeyInput" placeholder="AIzaSy..." />
                <div class="modal-actions">
                    <button id="btnSaveKey" class="primary-btn">Simpan</button>
                    <button id="btnCloseModal" class="secondary-btn">Tutup</button>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
